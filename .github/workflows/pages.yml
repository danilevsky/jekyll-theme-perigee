name: Demo site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - run: gem build jekyll-theme-perigee.gemspec
      # The site is built with --baseurl (e.g. /jekyll-theme-perigee), but files sit at the root of _site/,
      # so strip the prefix before htmlproofer resolves internal URLs to files. With an empty base path
      # (custom domain) the pattern becomes "^/:/", which changes nothing.
      - run: >-
          bundle exec htmlproofer _site --disable-external --checks Links,Images,Scripts
          --swap-urls "^${{ steps.pages.outputs.base_path }}/:/"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
